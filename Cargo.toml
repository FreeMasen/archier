[package]
name = "archier"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Robert Masen"]
categories = ["parsing", "parser-implementations"]
exclude = ["conformance/"]


[workspace]
members = ["examples/google-drive"]

[features]
default = ["case-insensitive"]
# Spec §1.3 (optional): `Options::CASE_INSENSITIVE_KEYS`.
case-insensitive = []
# Spec §7 (deprecated): `Options::ENABLE_INLINE_COMMENTS`.
inline-comments = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dev-dependencies]
serde_json = "1"
