[package]
name = "archier"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Robert Masen"]
categories = ["parsing", "parser-implementations"]
exclude = ["conformance/"]


[workspace]
members = ["examples/google-drive"]

[features]
default = ["case-insensitive"]
# Spec §1.3 (optional): `Options::CASE_INSENSITIVE_KEYS`.
case-insensitive = []
# Spec §7 (deprecated): `Options::ENABLE_INLINE_COMMENTS`.
inline-comments = []
# NPR's betty dialect: `Options::BETTY`.
betty = ["dep:id-arena"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
id-arena = { version = "2.3.0", optional = true }

[dev-dependencies]
# `preserve_order` keeps the document's key order in examples/to_json.rs.
serde_json = { version = "1", features = ["preserve_order"] }
